name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signing key was received
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))"
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is NOT set"
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName

      - name: Locate installer artifacts
        id: artifacts
        shell: pwsh
        run: |
          $exe  = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe"     | Select-Object -First 1
          $zip  = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*.nsis.zip"      | Select-Object -First 1
          $sig  = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*.nsis.zip.sig"  | Select-Object -First 1
          # fall back to .exe.sig if no .nsis.zip.sig exists
          if (-not $sig) { $sig = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe.sig" | Select-Object -First 1 }
          Write-Host "exe:  $($exe.Name)"
          Write-Host "zip:  $($zip.Name)"
          Write-Host "sig:  $($sig.Name)"
          echo "EXE_PATH=$($exe.FullName)"  >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)"      >> $env:GITHUB_OUTPUT
          echo "ZIP_PATH=$($zip.FullName)"  >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$($zip.Name)"      >> $env:GITHUB_OUTPUT
          echo "SIG_PATH=$($sig.FullName)"  >> $env:GITHUB_OUTPUT

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $sig = Get-Content "${{ steps.artifacts.outputs.SIG_PATH }}" -Raw
          # updater must point to the .nsis.zip if present, otherwise fall back to .exe
          $downloadName = if ("${{ steps.artifacts.outputs.ZIP_NAME }}" -ne "") { "${{ steps.artifacts.outputs.ZIP_NAME }}" } else { "${{ steps.artifacts.outputs.EXE_NAME }}" }
          $url = "https://github.com/Benjatator/toDoList/releases/download/${{ github.ref_name }}/$downloadName"
          $manifest = @{
            version  = $version
            notes    = "See the changelog in the app for release notes."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url       = $url
                signature = $sig.Trim()
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content latest.json
          Write-Host $manifest

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.EXE_PATH }}
            ${{ steps.artifacts.outputs.ZIP_PATH }}
            latest.json
          generate_release_notes: false
          body: "See the in-app changelog for release notes."
